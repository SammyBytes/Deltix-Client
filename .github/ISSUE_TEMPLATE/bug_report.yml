name: Bug report
description: Something in Deltix-Client isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerability?** Do not file it here — use the
        [Security tab](../../security/advisories/new) for private reporting
        instead (see `SECURITY.md`).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal command(s) run, including relevant env vars (redact secrets/tokens!).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `deltix --version` (once available) or `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant CLI output. Redact session tokens, credentials, and any customer data.
      render: json
