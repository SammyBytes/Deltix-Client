name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_call: {} # allows release.yml to reuse this suite as a publish gate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Install Dolt (for mysql-embedded integration tests)
        run: |
          set -euxo pipefail
          VERSION="2.3.1"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) A="amd64" ;;
            aarch64) A="arm64" ;;
            *) echo "unsupported arch ${ARCH}"; exit 1 ;;
          esac
          TARBALL="dolt-linux-${A}.tar.gz"
          URL="https://github.com/dolthub/dolt/releases/download/v${VERSION}/${TARBALL}"
          curl -fsSL -o "/tmp/${TARBALL}" "${URL}"
          mkdir -p /tmp/dolt
          tar -xzf "/tmp/${TARBALL}" -C /tmp/dolt
          BIN="$(find /tmp/dolt -type f -name dolt -perm -u+x | head -n1)"
          echo "DELTIX_DOLT_BIN_PATH=${BIN}" >> "${GITHUB_ENV}"

      - name: Integration tests
        run: bun run test:integration

      - name: Smoke tests
        run: bun run test:smoke
